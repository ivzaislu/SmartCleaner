[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcleaner"
version = "2.0.2"
description = "Professional system cleaning and optimization utility in CCleaner style"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Environment :: X11 :: Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
]
dependencies = [
    "PySide6>=6.5.0",
    "psutil>=5.9.0",
    "cryptography>=42",
]

[project.gui-scripts]
smartcleaner = "smartcleaner.gui:main"

[tool.setuptools.packages.find]
include = ["smartcleaner", "smartcleaner.*"]
