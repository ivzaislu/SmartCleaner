name: Driver manager tests

on:
  pull_request:
    paths:
      - "smartcleaner/driver_actions.py"
      - "smartcleaner/driver_updates.py"
      - "smartcleaner/driver_sources.py"
      - "smartcleaner/driver_discovery.py"
      - "smartcleaner/gui.py"
      - "tests/test_driver_actions.py"
      - "tests/test_driver_updates.py"
      - "tests/test_driver_sources.py"
      - "tests/test_driver_discovery.py"
      - "tests/test_gui_driver_hold.py"
      - ".github/workflows/driver-manager-tests.yml"
  workflow_dispatch:

jobs:
  driver-tests:
    name: Driver tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project and test dependencies
        run: python -m pip install -e . pytest
      - name: Run mocked driver and offscreen GUI tests
        run: python -m pytest -q tests/test_driver_actions.py tests/test_driver_updates.py tests/test_driver_sources.py tests/test_driver_discovery.py tests/test_gui_driver_hold.py
